[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "inferential-safety-lab"
version = "0.2.1"
description = "Interactive synthetic experiments for understanding analysis choices when data go wrong."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Inferential Safety Lab author"}]
keywords = ["simulation", "statistics", "missing-data", "robustness", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "streamlit>=1.44,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.13,<2",
  "playwright>=1.55,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
inferential-safety = "inferential_safety_lab.cli:main"

[project.urls]
Homepage = "https://github.com/aldaqrouqtaysir/inferential-safety-lab"
Repository = "https://github.com/aldaqrouqtaysir/inferential-safety-lab"
Documentation = "https://github.com/aldaqrouqtaysir/inferential-safety-lab/tree/main/docs"
Issues = "https://github.com/aldaqrouqtaysir/inferential-safety-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "regression: deterministic cross-process and calibration checks",
  "privacy: synthetic-only and no-network boundary checks",
]

[tool.coverage.run]
branch = true
source = [
  "inferential_safety_lab.core",
  "inferential_safety_lab.domain",
  "inferential_safety_lab.methods",
  "inferential_safety_lab.metrics",
  "inferential_safety_lab.reporting",
  "inferential_safety_lab.services",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inferential_safety_lab"]
exclude = ["src/inferential_safety_lab/ui/app.py"]
warn_unused_ignores = true
