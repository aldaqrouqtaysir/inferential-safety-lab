<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a-title a-desc" viewBox="0 0 1460 230">
<title id="a-title">Inferential Safety Lab architecture</title><desc id="a-desc">Configuration enters one shared service. Evaluator truth is separated from observed analysis data. Methods return typed outcomes that become aggregate JSON and an HTML Safety Card.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A64237"/></marker></defs>
<style>.box{fill:#F3EEE4;stroke:#17324D;stroke-width:1.4}.heading{font:700 15px "Aptos", "Segoe UI", system-ui, sans-serif;fill:#17324D}.sub{font:12px "Aptos", "Segoe UI", system-ui, sans-serif;fill:#536473}.arrow{stroke:#A64237;stroke-width:2;fill:none}</style>
<rect width="100%" height="100%" fill="#FFFDF8"/><line x1="225" y1="115" x2="275" y2="115" class="arrow" marker-end="url(#arrow)"/><line x1="465" y1="115" x2="515" y2="65" class="arrow" marker-end="url(#arrow)"/><line x1="610" y1="102" x2="610" y2="128" class="arrow" marker-end="url(#arrow)"/><line x1="705" y1="165" x2="755" y2="115" class="arrow" marker-end="url(#arrow)"/><line x1="945" y1="115" x2="995" y2="115" class="arrow" marker-end="url(#arrow)"/><line x1="1185" y1="115" x2="1235" y2="65" class="arrow" marker-end="url(#arrow)"/><line x1="1185" y1="115" x2="1235" y2="165" class="arrow" marker-end="url(#arrow)"/><rect x="35" y="78" width="190" height="74" rx="12" class="box"/><text x="49" y="107" class="heading">Bounded JSON config</text><text x="49" y="130" class="sub">Schema v1 + preset</text><rect x="275" y="78" width="190" height="74" rx="12" class="box"/><text x="289" y="107" class="heading">Shared lab service</text><text x="289" y="130" class="sub">UI and CLI entry</text><rect x="515" y="28" width="190" height="74" rx="12" class="box"/><text x="529" y="57" class="heading">Evaluator truth</text><text x="529" y="80" class="sub">Latent clean record</text><rect x="515" y="128" width="190" height="74" rx="12" class="box"/><text x="529" y="157" class="heading">Observed analysis</text><text x="529" y="180" class="sub">Only method capability</text><rect x="755" y="78" width="190" height="74" rx="12" class="box"/><text x="769" y="107" class="heading">Fixed method panel</text><text x="769" y="130" class="sub">Typed outcomes</text><rect x="995" y="78" width="190" height="74" rx="12" class="box"/><text x="1009" y="107" class="heading">Aggregate metrics</text><text x="1009" y="130" class="sub">No row-level export</text><rect x="1235" y="28" width="190" height="74" rx="12" class="box"/><text x="1249" y="57" class="heading">Canonical JSON</text><text x="1249" y="80" class="sub">Replay manifest</text><rect x="1235" y="128" width="190" height="74" rx="12" class="box"/><text x="1249" y="157" class="heading">Safety Card</text><text x="1249" y="180" class="sub">Self-contained HTML</text></svg>
