<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 1100 268">
<title id="chart-title">Coverage beside interval availability</title><desc id="chart-desc">Paired, non-stacked bars show conditional coverage and interval availability only for methods whose intervals are scientifically applicable.</desc>
<style>.title{font:700 22px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;fill:#17324D}.method{font:600 13px "Aptos", "Segoe UI", system-ui, sans-serif;fill:#17324D}.method-code{font:700 12px "Cascadia Mono", "SFMono-Regular", Consolas, monospace;fill:#17324D}.value{font:12px "Cascadia Mono", "SFMono-Regular", Consolas, monospace;fill:#17324D}.tick{font:11px "Aptos", "Segoe UI", system-ui, sans-serif;fill:#17324D}.axis{stroke:#CFC6B8;stroke-width:1}</style>
<rect width="100%" height="100%" fill="#F3EEE4"/><text x="16" y="35" class="title">Coverage beside interval availability</text>
<text x="400" y="58" class="tick">0%</text><text x="635.0" y="58" text-anchor="middle" class="tick">50%</text><text x="870" y="58" text-anchor="end" class="tick">100%</text><line x1="400" y1="64" x2="400" y2="243" class="axis"/><line x1="16" y1="100" x2="34" y2="100" stroke="#2F6F8F" stroke-width="4"/><text x="42" y="105" class="method-code">A</text><text x="62" y="105" class="method">Complete-case OLS with HC3</text><rect x="400" y="82.0" width="449.4" height="15" rx="3" fill="#2F6F8F"/><text x="1084" y="94.0" text-anchor="end" class="value">Coverage 95.6% (153/160)</text><rect x="400" y="104.0" width="470.0" height="15" rx="3" fill="#675779"/><text x="1084" y="116.0" text-anchor="end" class="value">Availability 100.0% (160/160)</text><line x1="16" y1="166" x2="34" y2="166" stroke="#356B5A" stroke-width="4"/><text x="42" y="171" class="method-code">B</text><text x="62" y="171" class="method">Complete-case OLS with minimum-evidence reporting guard</text><rect x="400" y="148.0" width="448.1" height="15" rx="3" fill="#2F6F8F"/><text x="1084" y="160.0" text-anchor="end" class="value">Coverage 95.3% (41/43)</text><rect x="400" y="170.0" width="126.3" height="15" rx="3" fill="#675779"/><text x="1084" y="182.0" text-anchor="end" class="value">Availability 26.9% (43/160)</text></svg>
